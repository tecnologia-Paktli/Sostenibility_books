# Robot de Sostenibility_books
# Se activa cuando:
#   - subes un CSV a entrada/   -> lo limpia, lo agrega al CSV del tema (o crea uno nuevo) y conecta portadas
#   - subes imágenes a portadas/ -> busca en todos los CSV los libros sin portada y las conecta
#   - lo corres a mano desde la pestaña Actions ("Run workflow")
name: Procesar CSV y portadas

on:
  push:
    paths:
      - "entrada/*.csv"
      - "portadas/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: procesar-csv
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Procesar CSV nuevos y conectar portadas
        run: |
          shopt -s nullglob
          archivos=(entrada/*.csv)
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python scripts/procesar_csv.py "${archivos[@]}" --repo . \
            --clave title --reconectar --mover-procesados --commit --push
